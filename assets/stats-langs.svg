<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="876" height="200" viewBox="0 0 876 200" role="img" aria-label="GitHub statistics and most used languages">
  <title>GitHub statistics and most used languages</title>
  <desc>Stars, commits, pull requests, issues, reviews and followers as of 2026-09-30 (UTC), next to the shares of the top 8 languages by bytes across owned, non-fork repositories; languages below the top 8 are omitted.</desc>
  <defs>
    <style>
    .bg { fill: #0F0F1A; }
    .primary { fill: #818CF8; font-family: 'Segoe UI', Ubuntu, Sans-Serif; }
    .text { fill: #C084FC; font-family: 'Segoe UI', Ubuntu, Sans-Serif; }
    .secondary { fill: #A78BFA; font-family: 'Segoe UI', Ubuntu, Sans-Serif; }
    .accent { fill: #EC4899; font-family: 'Segoe UI', Ubuntu, Sans-Serif; }
    .grid { stroke: #818CF8; stroke-width: 1; }
    .axis-label { fill: #818CF8; font-family: 'Segoe UI', Ubuntu, Sans-Serif; font-size: 10px; }
    .line { fill: none; stroke: #EC4899; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .point { fill: #EC4899; }
    .track { fill: #A78BFA; fill-opacity: 0.14; }
  </style>
    <linearGradient id="language-bar" gradientUnits="userSpaceOnUse" x1="462.00" y1="0" x2="631.70" y2="0">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
