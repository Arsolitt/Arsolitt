<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="436" height="200" viewBox="0 0 436 200" role="img" aria-label="GitHub statistics summary">
  <title>GitHub statistics summary</title>
  <desc>Stars, commits, pull requests, issues, reviews and followers as of 2026-09-30 (UTC).</desc>
  <defs>
    <style>
    .bg { fill: #0F0F1A; }
    .primary { fill: #818CF8; font-family: 'Segoe UI', Ubuntu, Sans-Serif; }
    .text { fill: #C084FC; font-family: 'Segoe UI', Ubuntu, Sans-Serif; }
    .secondary { fill: #A78BFA; font-family: 'Segoe UI', Ubuntu, Sans-Serif; }
    .accent { fill: #EC4899; font-family: 'Segoe UI', Ubuntu, Sans-Serif; }
    .grid { stroke: #818CF8; stroke-width: 1; }
    .axis-label { fill: #818CF8; font-family: 'Segoe UI', Ubuntu, Sans-Serif; font-size: 10px; }
    .line { fill: none; stroke: #EC4899; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .point { fill: #EC4899; }
    .track { fill: #A78BFA; fill-opacity: 0.14; }
  </style>

  </defs>
  <rect class="bg" x="0" y="0" width="436" height="200" rx="4.5"/>
  <text class="text" x="26" y="42.00" font-size="13">Total stars</text>
  <text class="primary" x="410" y="42.00" font-size="14" font-weight="600" text-anchor="end">40</text>
  <line class="grid" x1="26" y1="47.00" x2="410" y2="47.00" stroke-opacity="0.12"/>
  <text class="text" x="26" y="67.00" font-size="13">Commits (last year)</text>
  <text class="primary" x="410" y="67.00" font-size="14" font-weight="600" text-anchor="end">1,645</text>
  <line class="grid" x1="26" y1="72.00" x2="410" y2="72.00" stroke-opacity="0.12"/>
  <text class="text" x="26" y="92.00" font-size="13">Pull requests</text>
  <text class="primary" x="410" y="92.00" font-size="14" font-weight="600" text-anchor="end">48</text>
  <line class="grid" x1="26" y1="97.00" x2="410" y2="97.00" stroke-opacity="0.12"/>
  <text class="text" x="26" y="117.00" font-size="13">Issues</text>
  <text class="primary" x="410" y="117.00" font-size="14" font-weight="600" text-anchor="end">11</text>
  <line class="grid" x1="26" y1="122.00" x2="410" y2="122.00" stroke-opacity="0.12"/>
  <text class="text" x="26" y="142.00" font-size="13">Code reviews</text>
  <text class="primary" x="410" y="142.00" font-size="14" font-weight="600" text-anchor="end">26</text>
  <line class="grid" x1="26" y1="147.00" x2="410" y2="147.00" stroke-opacity="0.12"/>
  <text class="text" x="26" y="167.00" font-size="13">Followers</text>
  <text class="primary" x="410" y="167.00" font-size="14" font-weight="600" text-anchor="end">20</text>
  <text class="text" x="410" y="189" font-size="10" text-anchor="end" fill-opacity="0.6">updated 2026-09-30</text>
</svg>
