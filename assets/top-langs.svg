<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="436" height="200" viewBox="0 0 436 200" role="img" aria-label="Most used languages by bytes across owned repositories">
  <title>Most used languages by bytes across owned repositories</title>
